[advisories]
# Marvin Attack timing side-channel. Affects RSA private-key operations (decryption/signing) only.
# We use rsa solely for TSA signature verification (public key), so this does not apply. No fix available.
ignore = [
    "RUSTSEC-2023-0071",
    # tokio-tar PAX header bug — dev-only transitive dep via testcontainers; no production exposure.
    "RUSTSEC-2025-0111",
    # rustls-pemfile unmaintained — dev-only transitive dep via bollard/testcontainers; no production exposure.
    "RUSTSEC-2025-0134",
]
