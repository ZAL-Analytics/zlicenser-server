[workspace]
members = [
    "bin/zlicenser-server-bin",
    "bindings/python",
    "bindings/nodejs",
    "bindings/go",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
zlicenser-protocol = "0.3.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"

[patch.crates-io]
zlicenser-protocol = { path = "../zlicenser-protocol" }

[package]
name = "zlicenser-server"
version = "0.1.1"
edition = "2021"
authors = ["ZAL Analytics <info@zal-analytics.ch>"]
description = "Server library for the zlicenser hardware-bound software licensing framework."
documentation = "https://docs.rs/zlicenser-server"
repository = "https://github.com/zal-analytics/zlicenser-server"
license = "Apache-2.0"
keywords = ["licensing", "hardware-fingerprint", "server", "drm", "zlicenser"]
categories = ["cryptography", "authentication"]
readme = "README.md"
publish = true

[features]
default = ["storage-sqlite", "http-server"]
http-server = ["dep:axum", "dep:tower", "dep:tower-http"]
storage-sqlite = ["dep:sqlx", "sqlx?/sqlite", "sqlx?/migrate"]
storage-postgres = ["dep:sqlx", "sqlx?/postgres", "sqlx?/migrate"]
payment-stripe = ["dep:reqwest"]

[dependencies]
zlicenser-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

figment = { version = "0.10", features = ["toml"] }

ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek   = { version = "2", features = ["static_secrets"] }
sha2           = "0.10"
hkdf           = "0.12"
aes-gcm        = "0.10"
rand           = { version = "0.8", features = ["getrandom"] }
zeroize        = { version = "1", features = ["derive"] }
semver         = "1"

axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "macros", "uuid"], default-features = false, optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
insta = "1"
proptest = "1"
mockall = "0.13"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
